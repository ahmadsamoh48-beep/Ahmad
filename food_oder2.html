<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Two-Column Table Form</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            vertical-align: middle;
        }

        th {
            background: #f4f4f4;
        }

        .sub-col {
            display: flex;
            gap: 5px;
            align-items: center;
            flex-wrap: wrap;
        }

        .sub-col img {
            width: 100px;
            height: 100px;
            object-fit: cover;
        }

        .sub-col input[type="text"] {
            width: 100px;
        }

        textarea {
            width: 100%;
            height: 80px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <h2>Multi-Column Form</h2>

    <form id="myForm">
        <table align="center" style="width: 80%;">
            <thead>
                <tr>
                    <th>Main Column 1</th>
                    <th>Main Column 2</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>
                        <div class="sub-col">
                            <img src="IMG_2359.jpg" alt="Fried rice">
                            <input type="checkbox"
                                   name="menu"
                                   value="Fried rice">
                            <input type="text"
                                   value="Fried rice"
                                   readonly>
                            <input type="text"
                                   value="$2"
                                   readonly>
                            Quantity
                            <input type="number"
                                   min="1"
                                   value="1"
                                   style="width:70px">
                        </div>
                    </td>

                    <td>
                        <div class="sub-col">
                            <img src="IMG_2359.jpg" alt="Tom Yum">
                            <input type="checkbox"
                                   name="menu"
                                   value="Tom Yum Kung">
                            <input type="text"
                                   value="Tom Yam Kung (Shrimp soup)"
                                   readonly>
                            <input type="text"
                                   value="$5"
                                   readonly>
                            Quantity
                            <input type="number"
                                   min="1"
                                   value="1"
                                   style="width:70px">
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <button type="button" onclick="saveToMessage()">
            Chosen menu
        </button>

        <h3>Chosen menu item:</h3>
        <textarea id="outputMessage" readonly></textarea>

        <label for="address">Delivery Address:</label>
        <textarea id="address" name="address" required></textarea>

        <label for="orderAndAddress">Order and Address:</label>
        <textarea id="orderAndAddress"
                  name="orderAndAddress"
                  required></textarea>
    </form>

    <script>
        function saveToMessage() {
            const form = document.getElementById("myForm");
            const checkboxes = form.querySelectorAll(
                'input[type="checkbox"]'
            );

            let message = "Selected Items & Values:\n";

            checkboxes.forEach(function (check) {
                if (check.checked) {
                    const parent = check.closest(".sub-col");
                    const inputs = parent.querySelectorAll(
                        'input[type="text"], input[type="number"]'
                    );

                    const values = Array.from(inputs).map(
                        input => input.value
                    );

                    message += "- " + check.value + ": "
                        + values.join(", ") + "\n";
                }
            });

            document.getElementById("outputMessage").value = message;

            const address =
                document.getElementById("address").value;

            document.getElementById("orderAndAddress").value =
                message + "\nDelivery address: " + address;
        }
    </script>

</body>
</html>
