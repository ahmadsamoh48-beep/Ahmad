<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Order Email</title>
</head>
<body>

    <h2>Send Order to Email</h2>

    <form action="YOUR_FORMSPREE_URL" method="POST">
        <label for="order">Your order:</label>
        <textarea id="order"
                  name="order"
                  placeholder="Waiting for text ..."
                  required></textarea>

        <button type="submit">Send order to Email</button>
    </form>

</body>
</html>
